<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 1000" width="800" height="1000">
  <rect width="800" height="1000" fill="#FFF8F0"/>
  <rect x="70" y="80" width="660" height="800" fill="#2B2530" rx="6"/>
  <!-- Relief cuts: Chai glasses, kettle, and twilight window -->
  <g fill="#FFF8F0" stroke="#FFF8F0">
    <!-- Window arch frame in background -->
    <path d="M 200 600 L 200 300 Q 400 120 600 300 L 600 600 Z" fill="none" stroke-width="8"/>
    <!-- Crescent moon through window -->
    <path d="M 520 280 C 470 280 440 240 440 190 C 470 200 500 230 520 280 Z"/>
    <!-- Table ledge -->
    <rect x="100" y="660" width="600" height="16" fill="#FFF8F0"/>
    <!-- Chai kettle / teapot silhouette cuts -->
    <path d="M 280 660 C 270 560 300 480 370 480 C 440 480 470 560 460 660 Z"/>
    <path d="M 370 480 L 370 440 L 400 440 L 400 480" stroke-width="4"/>
    <path d="M 275 580 Q 220 560 230 500 Q 250 490 285 530" stroke-width="6" fill="none"/>
    <!-- Cutting lines across kettle -->
    <line x1="310" y1="540" x2="430" y2="540" stroke-width="4"/>
    <line x1="300" y1="580" x2="440" y2="580" stroke-width="4"/>
    <line x1="290" y1="620" x2="450" y2="620" stroke-width="4"/>
    <!-- Cutting Chai glass -->
    <path d="M 520 660 L 510 550 L 570 550 L 560 660 Z"/>
    <line x1="514" y1="580" x2="566" y2="580" stroke-width="3"/>
    <line x1="517" y1="610" x2="563" y2="610" stroke-width="3"/>
    <!-- Steam lines rising -->
    <path d="M 535 530 Q 520 480 540 440 Q 555 400 535 360" stroke-width="4" stroke-linecap="round" fill="none"/>
    <path d="M 550 520 Q 565 470 550 430 Q 535 390 555 350" stroke-width="4" stroke-linecap="round" fill="none"/>
    <!-- Relief background chatter gouge textures -->
    <path d="M 120 740 L 170 750 M 130 780 L 190 790 M 610 740 L 670 750" stroke-width="4" stroke-linecap="round"/>
  </g>
  <text x="80" y="930" font-family="'Caveat', cursive" font-size="28" fill="#4A4250">A/P 1/10</text>
  <text x="330" y="930" font-family="'Caveat', cursive" font-size="28" fill="#4A4250">"CHAI AT TWILIGHT"</text>
  <text x="630" y="930" font-family="'Caveat', cursive" font-size="28" fill="#4A4250">AK '26</text>
</svg>

