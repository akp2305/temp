<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 1000" width="800" height="1000">
  <rect width="800" height="1000" fill="#FFF8F0"/>
  <rect x="70" y="80" width="660" height="800" fill="#2B2530" rx="6"/>
  <!-- Relief cuts: Architecture arch, potted monstera, monsoon rain lines -->
  <g fill="#FFF8F0" stroke="#FFF8F0">
    <!-- Classical arch balcony -->
    <path d="M 160 760 L 160 360 Q 400 140 640 360 L 640 760 Z" fill="none" stroke-width="12"/>
    <path d="M 180 760 L 180 375 Q 400 180 620 375 L 620 760 Z" fill="none" stroke-width="4"/>
    <!-- Diagonal rain cuts outside the arch -->
    <line x1="220" y1="200" x2="160" y2="340" stroke-width="3" stroke-linecap="round"/>
    <line x1="300" y1="180" x2="240" y2="320" stroke-width="3" stroke-linecap="round"/>
    <line x1="420" y1="160" x2="360" y2="300" stroke-width="3" stroke-linecap="round"/>
    <line x1="520" y1="180" x2="460" y2="320" stroke-width="3" stroke-linecap="round"/>
    <line x1="600" y1="220" x2="540" y2="360" stroke-width="3" stroke-linecap="round"/>
    <!-- Balcony railing grillwork -->
    <rect x="180" y="620" width="440" height="12" fill="#FFF8F0"/>
    <rect x="180" y="740" width="440" height="16" fill="#FFF8F0"/>
    <line x1="230" y1="632" x2="230" y2="740" stroke-width="6"/>
    <line x1="290" y1="632" x2="290" y2="740" stroke-width="6"/>
    <line x1="350" y1="632" x2="350" y2="740" stroke-width="6"/>
    <line x1="410" y1="632" x2="410" y2="740" stroke-width="6"/>
    <line x1="470" y1="632" x2="470" y2="740" stroke-width="6"/>
    <line x1="530" y1="632" x2="530" y2="740" stroke-width="6"/>
    <line x1="590" y1="632" x2="590" y2="740" stroke-width="6"/>
    <!-- Terracotta planter pot with large linocut monstera leaves -->
    <path d="M 330 740 L 350 630 L 450 630 L 470 740 Z"/>
    <path d="M 400 630 Q 300 520 280 430 C 340 430 380 490 400 550 C 420 480 470 410 520 420 C 510 510 470 570 400 630 Z"/>
    <path d="M 400 550 Q 400 370 400 320" stroke-width="5" fill="none"/>
  </g>
  <text x="80" y="930" font-family="'Caveat', cursive" font-size="28" fill="#4A4250">A/P 6/12</text>
  <text x="320" y="930" font-family="'Caveat', cursive" font-size="28" fill="#4A4250">"MONSOON TERRACE"</text>
  <text x="630" y="930" font-family="'Caveat', cursive" font-size="28" fill="#4A4250">AK '26</text>
</svg>

