<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <script>
    (function() {
      var p = window.location.pathname;
      if (p.endsWith('.html')) {
        var clean = p.replace(/\.html$/, '/');
        window.location.replace(clean + window.location.search + window.location.hash);
      }
    })();
  </script>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Page Not Found — Anisha Khanduja Studio</title>
  <link rel="icon" type="image/jpeg" href="assets/img/branding/logo.png">

  <!-- Google Fonts: Cormorant Garamond & Plus Jakarta Sans -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;0,600;0,700;1,400;1,500;1,600&family=Plus+Jakarta+Sans:ital,wght@0,300;0,400;0,500;0,600;0,700;1,400&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="css/style.css">
  <style>
    .not-found-wrap {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 2rem;
      text-align: center;
    }
    .not-found-card {
      background-color: var(--surface-pure);
      border: 1px solid var(--border-subtle);
      border-radius: var(--radius-md);
      box-shadow: var(--shadow-lg);
      padding: clamp(2rem, 5vw, 3.5rem);
      max-width: 540px;
      width: 100%;
    }
    .not-found-code {
      font-family: var(--font-display);
      font-size: clamp(4rem, 10vw, 6.5rem);
      font-weight: 500;
      color: var(--gold-primary);
      line-height: 1;
      margin-bottom: 1rem;
      letter-spacing: 0.05em;
    }
  </style>
</head>
<body>
  <div class="not-found-wrap">
    <div class="not-found-card">
      <div class="sticker sticker-limited" style="margin-bottom: 1.5rem;">
        Edition Not Found ✦ 404
      </div>
      <div class="not-found-code">404</div>
      <h1 style="font-size: var(--text-2xl); margin-bottom: 1rem;">
        Looks like this block was carved away!
      </h1>
      <p style="color: var(--ink-light); margin-bottom: 2rem; font-size: var(--text-base);">
        The page you are looking for might have been retired, moved, or never pressed onto paper.
      </p>
      <div style="display: flex; justify-content: center; gap: 1rem; flex-wrap: wrap;">
        <a href="./" class="btn btn-primary btn-lg">
          ← Back to Studio Gallery
        </a>
        <a href="about/" class="btn btn-secondary btn-lg">
          Meet Anisha
        </a>
      </div>
    </div>
  </div>
</body>
</html>
