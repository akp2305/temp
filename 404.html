<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Page Not Found — Anisha Khanduja Studio</title>
  <link rel="icon" type="image/svg+xml" href="favicon.svg">
  <link rel="stylesheet" href="css/style.css">
  <style>
    .not-found-wrap {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 2rem;
      text-align: center;
    }
    .not-found-card {
      background-color: var(--surface-pure);
      border: var(--border-thick);
      border-radius: var(--radius-lg);
      box-shadow: var(--shadow-lg);
      padding: clamp(2rem, 5vw, 3.5rem);
      max-width: 540px;
      width: 100%;
      transform: rotate(-1deg);
    }
    .not-found-code {
      font-family: var(--font-display);
      font-size: clamp(4rem, 10vw, 6.5rem);
      font-weight: 700;
      color: var(--terracotta);
      line-height: 1;
      margin-bottom: 1rem;
    }
  </style>
</head>
<body>
  <div class="not-found-wrap">
    <div class="not-found-card">
      <div class="sticker sticker-limited sticker-rotate-left" style="margin-bottom: 1.5rem;">
        Edition Not Found ✦ 404
      </div>
      <div class="not-found-code">404</div>
      <h1 style="font-size: var(--text-2xl); margin-bottom: 1rem;">
        Looks like this block was carved away!
      </h1>
      <p style="color: var(--ink-light); margin-bottom: 2rem; font-size: var(--text-base);">
        The page you are looking for might have been retired, moved, or never pressed onto paper.
      </p>
      <div style="display: flex; justify-content: center; gap: 1rem; flex-wrap: wrap;">
        <a href="index.html" class="btn btn-primary btn-lg">
          ← Back to Studio Gallery
        </a>
        <a href="index.html#about" class="btn btn-secondary btn-lg">
          Meet Anisha
        </a>
      </div>
    </div>
  </div>
</body>
</html>
